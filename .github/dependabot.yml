version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # svelte-check 4.7 accepts TypeScript 5 or 6 only; TypeScript 7 fails npm install
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /tools
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
