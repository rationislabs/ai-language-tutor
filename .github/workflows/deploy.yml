name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skipped until the repository variable CLOUDFLARE_PROJECT is set (README: one-time steps).
    if: vars.CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      # Restore, then save again at the end even if the build fails: an aborted run keeps every
      # file it already downloaded or rendered. Keys are per run; restore takes the newest.
      # tools/.cache: Tatoeba exports (re-downloaded when older than 30 days), frequency lists,
      # Piper voices.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: tools-cache-${{ github.run_id }}
          restore-keys: tools-cache-
      # Rendered audio: file names are hashes of language, voice and text, so restored files
      # stay valid and only new or changed sentences are rendered.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/public/audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-
      - working-directory: tools
        run: uv sync --frozen --group audio && uv run python -m tutortools build
      - working-directory: web
        run: npm ci && npm run build
      - working-directory: web
        run: npx --yes wrangler@4.149.0 pages deploy dist --project-name="$PROJECT" --branch=main
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: tools-cache-${{ github.run_id }}
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/public/audio
          key: audio-${{ github.run_id }}
