    picture: 📝
    help: {en: "A coffee and a tea. Very good!", de: "Ein Kaffee und ein Tee. Sehr gut!"}
  - text: "Voici le café… et voici le thé."
    speaker: 1
    picture: 🫖
    help: {en: "Here's the coffee… and here's the tea.", de: "Hier ist der Kaffee… und hier ist der Tee."}
