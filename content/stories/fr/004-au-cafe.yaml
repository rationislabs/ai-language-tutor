    help: {en: "Léa and Hugo go to the café.", de: "Léa und Hugo gehen ins Café."}
  - text: "Bonjour ! Vous voulez un café ?"
    speaker: 1
    picture: 🤵
    help: {en: "Hello! Would you like a coffee?", de: "Guten Tag! Möchten Sie einen Kaffee?"}
