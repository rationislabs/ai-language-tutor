    picture: 😊
    help: {en: "Thank you!", de: "Danke!"}
  - text: "Léa… je voudrais le café."
    speaker: 1
    picture: 😅
    help: {en: "Léa… I'd like the coffee.", de: "Léa… ich möchte lieber den Kaffee."}
  - text: "Et je voudrais le thé ! Voici le café, Hugo."
    picture: 🔄
    help: {en: "And I'd like the tea! Here's the coffee, Hugo.", de: "Und ich möchte den Tee! Hier ist der Kaffee, Hugo."}
  - text: "Merci, Léa !"
