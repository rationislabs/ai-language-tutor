lang: hu
level: A2
title: Kirándulás
names: [Anna, Péter, Kati, Dunát]
new_words: [kirándulás, hegy, erdő, sétál, fáradt, fent]
lemma_overrides: {igen: igen, mentek: megy, sétáltak: sétál, fáradt: fáradt, fent: fent, látták: lát, evett: eszik, vagy: van}
sentences:
  - text: "Szombaton Anna, Péter és Kati kirándulásra mentek."
    picture: "🥾"
    help: {en: "On Saturday Anna, Péter and Kati went on a hike.", de: "Am Samstag machten Anna, Péter und Kati einen Ausflug."}
  - text: "Busszal mentek a hegyekbe."
    picture: "🚌"
    help: {en: "They went to the hills by bus.", de: "Sie fuhren mit dem Bus in die Berge."}
  - text: "Az erdőben sokat sétáltak."
    picture: "🌲"
    help: {en: "They walked a lot in the forest.", de: "Im Wald sind sie viel gelaufen."}
  - text: "Az erdő zöld volt és nagyon szép."
    picture: "🌳"
    help: {en: "The forest was green and very beautiful.", de: "Der Wald war grün und sehr schön."}
  - text: "Kati, én nagyon fáradt vagyok!"
    speaker: 1
    picture: "😩"
    help: {en: "Kati, I'm really tired!", de: "Kati, ich bin sehr müde!"}
  - text: "Gyere, Péter! Csak egy kicsit sétálunk!"
    speaker: 2
    picture: "👉"
    help: {en: "Come on, Péter! We're only walking a little bit!", de: "Komm, Péter! Wir gehen nur noch ein bisschen!"}
  - text: "Három órakor fent voltak a hegyen."
    picture: "⛰️"
    help: {en: "At three o'clock they were up on the hill.", de: "Um drei Uhr waren sie oben auf dem Berg."}
  - text: "Fent látták a várost és a Dunát."
    picture: "🏙️"
    help: {en: "From up there they saw the city and the Danube.", de: "Von oben sahen sie die Stadt und die Donau."}
  - text: "Látod, Péter? Ez nagyon szép!"
    speaker: 2
    picture: "😍"
    help: {en: "See, Péter? This is really beautiful!", de: "Siehst du, Péter? Das ist sehr schön!"}
  - text: "Igen, szép. De most fáradt vagyok. Itt alszom!"
    speaker: 1
    picture: "😴"
    help: {en: "Yes, it's beautiful. But now I'm tired. I'm sleeping here!", de: "Ja, schön. Aber jetzt bin ich müde. Ich schlafe hier!"}
  - text: "Péter a hegyen ült, és almát evett."
    picture: "🍎"
    help: {en: "Péter sat on the hill and ate an apple.", de: "Péter saß auf dem Berg und aß einen Apfel."}
  - text: "Ez jó kirándulás volt!"
    speaker: 2
    picture: "🥰"
    help: {en: "That was a good hike!", de: "Das war ein schöner Ausflug!"}
